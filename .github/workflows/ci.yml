name: Business workbench CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  song-component:
    name: Optional online song component
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install optional library dependencies without lifecycle scripts
        working-directory: components/song_requests
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Matching and real stdio process contracts
        working-directory: components/song_requests
        run: npm test

  checks:
    name: Python and CPU contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Project uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.8'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Locked project environment
        run: uv sync --locked --group dev
      - name: Image decoder and Chinese fonts for rendering contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - name: Workbench tests
        run: |
          mkdir -p tmp/ci-results
          uv run --locked pytest -q --junitxml=tmp/ci-results/pytest.xml
      - name: CPU check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-checks-${{ github.sha }}
          path: tmp/ci-results/pytest.xml
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
