<section data-section="dynamics" class="win-page-view" hidden>
  <div class="page-heading win-heading">
    <div class="heading-title-box">
      <p class="eyebrow">以大肥鱼第一人称视角分享日常与趣事</p>
      <h1>动态运营工作台</h1>
    </div>
    <div class="actions">
      <button id="refresh-dynamics" type="button" class="win-btn">刷新数据</button>
      <button id="stop-dynamics" type="button" class="danger" disabled>停止动态运营</button>
    </div>
  </div>

  <!-- 运营策略 GroupBox -->
  <div class="win-group-box">
    <div class="panel-heading">
      <div class="win-group-title" style="margin:0;">动态生成策略与发布频次</div>
      <span id="dynamic-mode" class="badge">正在读取</span>
    </div>
    <form id="dynamic-policy-form">
      <fieldset id="dynamic-policy-fields" class="provider-fields" disabled>
        <div class="policy-checks win-checks-bar">
          <label><input id="dynamic-enabled" type="checkbox"> 开启动态运营</label>
          <label><input id="dynamic-auto-publish" type="checkbox" checked> 自动发布（关闭则存为草稿待人工审核）</label>
          <label><input id="dynamic-use-memes" type="checkbox"> 允许模型为动态附加 1 张专属表情包</label>
        </div>
        <div class="form-grid" style="margin-top:12px;">
          <label>评估间隔（秒）<input id="dynamic-evaluate-interval" type="number" min="300" max="86400" step="1" value="1800" required></label>
          <label>最短发布间隔（秒）<input id="dynamic-min-post-interval" type="number" min="21600" max="604800" step="1" value="21600" required></label>
          <label>24 小时最大尝试次数<input id="dynamic-max-posts" type="number" min="1" max="2" step="1" value="2" required></label>
          <label>运营记忆摘要预算 (tokens)<input id="dynamic-memory-summary-max" type="number" min="256" max="4096" step="1" value="2048" required></label>
        </div>
      </fieldset>
      <div class="actions" style="margin-top:14px;">
        <button id="save-dynamic-policy" type="submit" class="primary win-btn" disabled>保存运营策略</button>
        <button id="evaluate-dynamics" type="button" class="win-btn" disabled>立即评估并生成草稿</button>
        <a href="#accounts" class="inline-link">配置 B站共用账号 →</a>
      </div>
    </form>
    <p id="dynamic-policy-state" class="hint" role="status"></p>
    <dl id="dynamic-policy-status" class="description-list"></dl>
  </div>

  <!-- 双栏布局：动态记录与编辑器 -->
  <div class="comment-layout win-split-pane" style="margin-top:16px;">
    <article class="win-group-box">
      <div class="panel-heading">
        <div class="win-group-title" style="margin:0;">动态草稿与发布履历</div>
        <span id="dynamic-count" class="hint"></span>
      </div>
      <div class="table-scroll">
        <table><thead><tr><th>时间 / 角色</th><th>正文预览</th><th>状态</th></tr></thead><tbody id="dynamic-posts"></tbody></table>
      </div>
    </article>

    <article class="win-group-box draft-panel">
      <div class="panel-heading">
        <div class="win-group-title" style="margin:0;">动态审核与编辑</div>
        <span id="dynamic-post-status" class="badge">选择动态</span>
      </div>
      <dl id="dynamic-post-meta" class="description-list"></dl>
      <div class="actions dm-meme-actions" style="margin-bottom:10px;">
        <button id="dynamic-pick-meme" type="button" class="win-btn" disabled>选择配图表情包</button>
        <button id="dynamic-clear-meme" type="button" class="win-btn" disabled>移除配图</button>
        <a href="#assets" class="win-link-btn">管理表情包图库 →</a>
      </div>
      <div id="dynamic-meme-preview" class="meme-attachment-preview" hidden>
        <strong id="dynamic-meme-name"></strong>
        <div id="dynamic-meme-image"></div>
        <p id="dynamic-meme-availability" class="hint"></p>
      </div>
      <label>编辑动态正文
        <textarea id="dynamic-post-text" rows="7" disabled placeholder="选择左侧动态进行审核与编辑..."></textarea>
      </label>
      <div class="actions" style="margin-top:12px;">
        <button id="approve-dynamic" class="primary win-btn" disabled>审核通过</button>
        <button id="reject-dynamic" class="win-btn danger" disabled>拒绝</button>
        <button id="publish-dynamic" class="win-btn" disabled>发布已审核动态</button>
      </div>
      <p id="dynamic-post-note" class="hint" role="status"></p>
      <section id="dynamic-continuation" hidden></section>
      <div class="win-subgroup-box" style="margin-top:14px;">
        <div class="win-subgroup-title">素材来源原文</div>
        <div id="dynamic-post-sources" class="quoted-text">暂无来源。</div>
      </div>
      <div class="win-subgroup-box" style="margin-top:10px;">
        <div class="win-subgroup-title">平台发布回执 / 报错记录</div>
        <pre id="dynamic-post-receipt" class="code-small">暂无回执。</pre>
      </div>
    </article>
  </div>

  <!-- 运营记忆摘要 & 决策记录并列展示 -->
  <div class="form-grid" style="margin-top:16px;">
    <div class="win-group-box">
      <div class="panel-heading">
        <div class="win-group-title" style="margin:0;">运营记忆摘要 (有界上下文)</div>
        <span id="dynamic-summary-valid" class="badge">正在读取</span>
      </div>
      <dl id="dynamic-summary-meta" class="description-list"></dl>
      <p id="dynamic-summary-state" class="hint" role="status"></p>
      <div class="table-scroll">
        <table><thead><tr><th>来源 ID</th><th>摘要摘录</th><th>类型</th></tr></thead><tbody id="dynamic-summary-entries"></tbody></table>
      </div>
    </div>

    <div class="win-group-box">
      <div class="panel-heading">
        <div class="win-group-title" style="margin:0;">模型自主决策记录</div>
        <span class="hint">记录发布、等待与决策理由</span>
      </div>
      <div class="table-scroll">
        <table><thead><tr><th>时间</th><th>决定</th><th>原因</th><th>来源 / 错误</th></tr></thead><tbody id="dynamic-decisions"></tbody></table>
      </div>
      <div id="dynamic-decision-continuation" hidden></div>
    </div>
  </div>

  <!-- 允许公开记忆 -->
  <div class="win-group-box" style="margin-top:16px;">
    <div class="win-group-title">允许用于公开动态的角色记忆素材</div>
    <div class="table-scroll">
      <table><thead><tr><th>公开使用</th><th>来源记忆描述</th><th>类型 / 当地时间</th></tr></thead><tbody id="dynamic-memories"></tbody></table>
    </div>
    <p id="dynamic-memory-state" class="hint" role="status"></p>
  </div>
</section>
