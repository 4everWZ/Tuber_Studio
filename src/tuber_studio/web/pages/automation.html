<section data-section="automation" class="win-page-view" hidden>
  <div class="page-heading win-heading">
    <h1 id="operation-page-title">自主运营</h1>
    <button id="op-toggle-auto" type="button" class="primary" disabled>开始自主运营</button>
  </div>
  <section id="operation-overview" class="operation-overview">
    <p id="op-home-state" role="status">正在读取运营状态…</p>
    <p id="op-permissions-summary" class="hint">正在读取当前允许的动作…</p>
    <p id="op-active-rounds" class="hint" role="status"></p>
  </section>
  <section id="operation-videos">
    <details id="operation-video-progress" class="discovery-status-compact"><summary>视频处理进度</summary>
      <div class="panel-heading"><span id="discovery-state" class="badge" role="status"></span><a id="discovery-round-link" hidden>来源记录 →</a></div>
      <span id="discovery-round-heading" hidden></span>
      <p id="discovery-result" role="status"></p><p id="discovery-counts" class="hint"></p>
      <div id="discovery-attention" hidden><ul id="discovery-actions"></ul></div>
    </details>
  <section class="discovery-history" style="margin-top:16px;">
    <div class="panel-heading">
      <h2>运营活动</h2>
      <div class="actions">
        <label class="history-day-label">日期 <input id="discovery-history-day" type="date"></label>
        <button id="discovery-history-today" type="button">今天</button>
        <button id="discovery-history-refresh" type="button">刷新</button>
      </div>
    </div>
    <div id="operation-activity-kinds" class="activity-kind-options" role="group" aria-label="活动类型">
      <button type="button" data-activity-kind="all" aria-pressed="true">全部</button>
      <button type="button" data-activity-kind="videos" aria-pressed="false">视频</button>
      <button type="button" data-activity-kind="comments" aria-pressed="false">评论</button>
      <button type="button" data-activity-kind="messages" aria-pressed="false">私信</button>
      <button type="button" data-activity-kind="dynamics" aria-pressed="false">动态</button>
    </div>
    <p id="discovery-history-counts" class="hint"></p>
    <p id="discovery-history-feedback" class="error-text" role="status"></p>
    <div id="discovery-activity-list"><p class="hint">正在读取活动记录…</p></div>
    <div class="actions history-pagination">
      <button id="discovery-history-prev" type="button" disabled>上一页</button>
      <span id="discovery-history-page" class="hint"></span>
      <button id="discovery-history-next" type="button" disabled>下一页</button>
    </div>
  </section>
  </section>
</section>
