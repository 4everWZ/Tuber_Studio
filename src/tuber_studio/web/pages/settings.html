<section data-section="settings" class="win-page-view" hidden>

  <div class="page-heading win-heading">
    <h1>工坊设置</h1>
    <a href="#voices" class="win-link-btn">角色音色试听 →</a>
  </div>

  <fieldset class="win-group-box">
    <legend>角色显示</legend>
    <label><input type="checkbox" data-display-setting="pets_enabled" disabled> 显示角色宠物</label>
    <label><input type="checkbox" disabled> 直播 Avatar（TBD／暂不可用）</label>
    <p class="hint">宠物开关控制对话、电话和直播中的一只宠物。关闭后仍可通话和播放直播音频。</p>
  </fieldset>

  <fieldset class="win-group-box" id="illustration-policy" disabled>
    <legend>运营配图</legend>
    <div class="checks">
      <label><input type="checkbox" name="generate_images"> 生图</label>
      <label><input type="checkbox" name="use_memes"> 图库</label>
    </div>
    <p class="hint">视频主评、私信和动态共用。都不勾选时关闭自动配图。</p>
    <p class="hint" role="status" id="illustration-policy-result"></p>
  </fieldset>

  <fieldset class="win-group-box" id="artwork-references">
    <legend>生图参考图</legend>
    <p class="hint" id="artwork-reference-scope"></p>
    <div class="form-grid" id="artwork-reference-variants"></div>
    <p class="hint" id="artwork-reference-result" role="status"></p>
  </fieldset>

  <section class="panel" id="providers-panel" data-workspace-anchor aria-labelledby="providers-heading">
    <div class="panel-heading">
      <h2 id="providers-heading" class="win-group-title">推理与任务</h2>
      <button type="button" id="check-providers-settings" class="win-btn">检查已保存的连接</button>
    </div>
    <p id="providers-check-result" class="hint" role="status"></p>
    <form id="providers-form">
      <fieldset id="provider-fields" aria-label="推理与任务设置" disabled>
        <section class="provider-section" aria-labelledby="foreground-settings-heading">
          <h3 id="foreground-settings-heading">前台 Omni</h3>
          <p class="hint">用于对话、私有通话和直播即时回应。</p>
          <label>前台模型别名<input id="omni-model" list="omni-model-options" required></label>
          <datalist id="omni-model-options"></datalist>
          <div class="actions">
            <button type="button" class="win-btn" id="omni-discover-models">读取已保存的前台模型别名</button>
            <span id="omni-discovery-state" class="hint" role="status"></span>
          </div>
          <label class="check-field"><input id="llm-enable-thinking" type="checkbox"> 启用前台思考</label>
        </section>

        <section class="provider-section" aria-labelledby="background-settings-heading">
          <h3 id="background-settings-heading">后台 Agent</h3>
          <p class="hint">用于复杂交办、自主运营、视频读帧和记忆整理。</p>
          <label>后台模型别名<input id="omni-responses-model" required></label>
          <div class="form-grid">
            <div>
              <label>评论、私信与动态 · 单次输出上限（tokens）
                <input id="llm-operations-tokens" type="number" min="1" max="65536" required
                  aria-describedby="operations-budget-hint">
              </label>
              <p class="hint" id="operations-budget-hint">每次生成运营决定或草稿的上限，含思考。刷视频的选片决策在运营设置里调整。</p>
            </div>
            <div>
              <label>委派任务 · 单次输出上限（tokens）
                <input id="background-budget" type="number" min="1" required aria-describedby="agent-budget-hint">
              </label>
              <p class="hint" id="agent-budget-hint">每轮生成计划、工具请求或成果文本的上限，含思考。一个任务可以有多轮。</p>
            </div>
            <label>单项任务并行取材数<input id="background-parallel" type="number" min="1" required></label>
            <label>单批视频抽帧上限<input id="video-max-frames" type="number" min="1" max="16" step="1" required></label>
          </div>
        </section>

        <details class="provider-section">
          <summary>共用连接与凭据</summary>
          <label>网关 API 地址<input id="omni-base-url" type="url" required></label>
          <label>应用凭据<input id="omni-key" type="password" autocomplete="new-password" placeholder="留空保留当前凭据"></label>
          <span id="omni-key-state" class="hint"></span>
          <label class="check-field"><input id="omni-clear-key" type="checkbox"> 清除已保存的应用凭据</label>
        </details>
      </fieldset>
      <div class="actions">
        <button class="primary win-btn" id="save-providers" type="submit" disabled>保存推理设置</button>
        <button class="win-btn" id="reset-providers" type="button" disabled>放弃修改</button>
      </div>
      <p id="providers-save-state" class="hint" role="status"></p>
    </form>
  </section>
</section>
