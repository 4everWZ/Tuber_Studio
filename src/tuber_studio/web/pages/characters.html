<section data-section="characters" class="win-page-view" hidden>

  <div class="page-heading win-heading">
    <div class="heading-title-box">
      <h1>角色卡工坊 (OC Studio)</h1>
      <p class="hint">当前激活角色 · <strong id="persona-current">待读取</strong></p>
    </div>
    <div class="persona-views" role="group" aria-label="角色来源">
      <button type="button" id="show-persona-model" class="win-btn" aria-controls="persona-model-view" aria-pressed="false">模型内建大肥鱼</button>
      <button type="button" id="show-persona-cards" class="win-btn" aria-controls="persona-card-view" aria-pressed="false">角色卡编辑器</button>
    </div>
  </div>

  <!-- 模型内建展示面板 -->
  <article class="win-group-box narrow" id="persona-model-view" hidden>
    <div class="panel-heading">
      <div class="win-group-title" style="margin:0;">大肥鱼 · 模型原生内建权重</div>
      <span id="persona-model-state" class="badge">待确认</span>
    </div>
    <p id="persona-model-detail" class="hint" style="line-height:1.6;"></p>
    <div class="actions" style="margin-top:12px;">
      <button type="button" id="persona-mode-action" class="primary win-btn" hidden>切回运营模式</button>
      <a href="#settings" class="win-link-btn">查看推理设置 →</a>
    </div>
  </article>

  <!-- 角色卡编辑器双栏 -->
  <div class="character-layout win-split-pane" id="persona-card-view" hidden>
    <article class="win-group-box">
      <div class="win-group-title">角色列表 (OCs)</div>
      <div id="character-list" class="object-list" style="margin-top:10px;"></div>

      <div class="win-subgroup-box" style="margin-top:16px;">
        <div class="win-subgroup-title">新建 / 克隆 OC</div>
        <form id="clone-form">
          <label>角色 ID<input id="clone-id" pattern="[a-z0-9_\-]+" maxlength="50" placeholder="whale_variant" required></label>
          <label>角色显示名称<input id="clone-name" placeholder="例如：电台大肥鱼" required></label>
          <button type="submit" class="win-btn" style="margin-top:8px;">创建此 OC</button>
        </form>
      </div>
    </article>

    <article class="win-group-box">
      <div class="panel-heading">
        <div class="win-group-title" id="editor-title" style="margin:0;">选择角色</div>
        <button id="activate-character" class="primary win-btn" disabled>激活此角色版本</button>
      </div>

      <div class="form-grid" style="margin: 10px 0 12px;">
        <label>配置历史版本
          <select id="character-version" disabled></select>
        </label>
        <div class="hint align-bottom">切换角色或回滚版本时自动平滑重置会话任务。</div>
      </div>

      <!-- OC Tabs 选项卡 -->
      <div class="oc-tab-nav win-property-tabs" role="tablist" aria-label="角色卡编辑栏目">
        <button type="button" class="oc-tab-btn active prop-tab" id="oc-tab-persona" role="tab" aria-selected="true" aria-controls="tab-oc-persona" data-tab="tab-oc-persona">核心人设与性格</button>
        <button type="button" class="oc-tab-btn prop-tab" id="oc-tab-style" role="tab" aria-selected="false" aria-controls="tab-oc-style" tabindex="-1" data-tab="tab-oc-style">说话风格与短句示范</button>
        <button type="button" class="oc-tab-btn prop-tab" id="oc-tab-assets" role="tab" aria-selected="false" aria-controls="tab-oc-assets" tabindex="-1" data-tab="tab-oc-assets">音色与形象绑定</button>
        <button type="button" class="oc-tab-btn prop-tab" id="oc-tab-json" role="tab" aria-selected="false" aria-controls="tab-oc-json" tabindex="-1" data-tab="tab-oc-json">高级 JSON 源码</button>
      </div>

      <!-- Tab 1: 核心设定 -->
      <div class="oc-tab-content active" id="tab-oc-persona" role="tabpanel" aria-labelledby="oc-tab-persona" style="margin-top:12px;">
        <label>核心身份与世界观 (Identity)
          <textarea id="oc-identity" class="code-editor" rows="4"></textarea>
        </label>
        <label style="margin-top:10px;">背景与生活细节 (Background)
          <textarea id="oc-background" class="code-editor" rows="3"></textarea>
        </label>
        <label style="margin-top:10px;">性格与动作反应特质 (Traits，每行一条)
          <textarea id="oc-traits" class="code-editor" rows="5"></textarea>
        </label>
      </div>

      <!-- Tab 2: 风格与台词规范 -->
      <div class="oc-tab-content" id="tab-oc-style" role="tabpanel" aria-labelledby="oc-tab-style" hidden style="margin-top:12px;">
        <div class="form-grid">
          <label>单句台词最短字数 (min_chars)
            <input id="oc-min-chars" type="number" min="1" max="120" value="1">
          </label>
          <label>单句台词最长字数 (max_chars)
            <input id="oc-max-chars" type="number" min="1" max="120" value="60">
          </label>
        </div>
        <label style="margin-top:10px;">口头禅 (Catchphrases，每行一条)
          <textarea id="oc-catchphrases" rows="3" placeholder="什么嘛&#10;再来一碗白饭&#10;本鱼"></textarea>
        </label>
        <label style="margin-top:10px;">表达规范与去AI味指导语 (Instructions)
          <textarea id="oc-instructions" class="code-editor" rows="4"></textarea>
        </label>
      </div>

      <!-- Tab 3: 音色与素材 -->
      <div class="oc-tab-content" id="tab-oc-assets" role="tabpanel" aria-labelledby="oc-tab-assets" hidden style="margin-top:12px;">
        <div class="form-grid">
          <label>绑定默认音色 (Voice Profile)
            <input id="oc-voice-profile" placeholder="whale_sovits_v2">
          </label>
          <label>形象描述清单 (Avatar Manifest)
            <input id="oc-avatar-manifest" value="assets/whale/manifest.json">
          </label>
        </div>
      </div>

      <!-- Tab 4: JSON 源码 -->
      <div class="oc-tab-content" id="tab-oc-json" role="tabpanel" aria-labelledby="oc-tab-json" hidden style="margin-top:12px;">
        <form id="character-form">
          <label>角色卡完整底层 JSON
            <textarea id="character-editor" class="code-editor" rows="18" spellcheck="false" disabled aria-describedby="character-help"></textarea>
          </label>
          <p id="character-help" class="hint">可直接编辑底层 JSON 源码。保存后将自动升级版本号，旧版本完整保留。</p>
        </form>
      </div>

      <div class="actions" style="margin-top:14px;">
        <button id="save-character" type="submit" form="character-form" class="primary win-btn" disabled>保存角色为新版本</button>
        <button id="reset-character" type="button" class="win-btn" disabled>放弃未保存修改</button>
        <span id="character-dirty" class="hint"></span>
      </div>
    </article>
  </div>

  <!-- 角色记忆与社群趣事 GroupBox -->
  <div class="win-group-box daily-memory-card" id="daily-memory-card" data-workspace-anchor style="margin-top:18px;">
    <div class="panel-heading">
      <div>
        <div class="win-group-title" style="margin:0;">📝 跨渠道每日记忆与社群趣事</div>
        <span class="hint">打通直播高光与评论热梗，为直播闲聊、视频回帖与动态提供鲜活谈资</span>
      </div>
      <div class="actions">
        <button type="button" id="extract-daily-memory" class="primary win-btn">✨ 提炼今日趣事</button>
        <button type="button" id="refresh-daily-memory" class="win-btn">刷新</button>
      </div>
    </div>
    <p id="daily-memory-notice" class="hint" role="status">正在加载每日记忆…</p>
    <div id="daily-memory-list" class="daily-memory-list" style="margin-top:10px;"></div>
  </div>
</section>
