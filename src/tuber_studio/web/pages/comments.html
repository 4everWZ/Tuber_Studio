<section data-section="comments" class="win-page-view" hidden>
  <div class="page-heading win-heading">
    <h1>评论与草稿</h1>
  </div>

  <details id="comment-sources" class="comment-input-panel" open>
    <summary>读取或导入评论</summary>
    <div id="comment-acquisition" data-workspace-anchor>
      <form id="fetch-comments-form" class="fetch-row">
        <label>视频 BV 号或链接<input id="comment-video" placeholder="BV… 或视频链接" required></label>
        <label>读取页数<select id="comment-pages"><option value="1">1 页</option><option value="2">2 页</option><option value="3">3 页</option><option value="5">5 页</option></select></label>
        <button class="primary" type="submit">读取评论</button>
      </form>
      <p id="fetch-state" class="hint" role="status"></p>
      <div class="actions"><button id="refresh-videos" type="button">热门视频</button><span id="comment-fetch-mode" class="hint"></span></div>
      <div id="popular-videos" class="video-list" hidden></div>
      <details id="comment-import" class="comment-import-panel" data-workspace-anchor>
        <summary>导入 JSON / CSV</summary>
        <form id="import-comments-form">
          <label>视频标识<input id="import-video" placeholder="BV… 或 import-开头的本地批次" required></label>
          <label>评论数据<textarea id="import-comments" class="compact-editor" rows="4" placeholder='[{"comment_id":"1","display_name":"观众","content":"今天吃白饭了吗？"}]' required></textarea></label>
          <div class="actions">
            <button id="submit-import" class="primary" type="submit">导入评论</button>
            <button id="preview-import" type="button">预览</button>
            <span id="import-preview-state" class="hint" role="status"></span>
          </div>
          <div id="import-preview" class="table-scroll" hidden>
            <table><thead><tr><th>评论 ID</th><th>楼 ID</th><th>父评论</th><th>用户</th><th>内容</th><th>点赞</th><th>时间</th></tr></thead><tbody id="import-preview-rows"></tbody></table>
          </div>
        </form>
      </details>
    </div>
  </details>

  <section id="comment-queue">
    <div class="queue-toolbar">
      <fieldset id="queue-status-options" class="queue-status-options">
        <legend>评论处理</legend><input id="queue-view" type="hidden" value="review">
        <label><input type="radio" name="queue-status" value="sources"><span>选择评论</span></label>
        <label><input type="radio" name="queue-status" value="review" checked><span>待审核</span></label>
        <label><input type="radio" name="queue-status" value="verify"><span>待核对</span></label>
        <label><input type="radio" name="queue-status" value="processing"><span>处理中</span></label>
        <label><input type="radio" name="queue-status" value="history"><span>已执行与历史</span></label>
      </fieldset>
      <div class="actions"><button id="queue-show-all" type="button" hidden>全部草稿</button><button id="refresh-queue" type="button">刷新</button></div>
    </div>
    <p id="queue-feedback" class="hint" role="status"></p>
    <div id="queue-records" class="review-layout win-split-pane">
      <article class="win-group-box">
        <div class="panel-heading"><h2 id="queue-list-title">评论草稿</h2><span id="selected-comment-count" class="hint"></span></div>
        <div id="comment-source-records" hidden>
          <div class="actions comment-selection-actions"><button id="generate-drafts" class="primary" type="button" disabled>生成选中评论的回复</button><span id="comment-count" class="hint"></span></div>
          <details class="comment-source-filters"><summary>筛选评论</summary>
            <div class="form-grid"><label>视频<input id="filter-video" placeholder="全部视频"></label><label>楼 ID<input id="filter-thread" placeholder="全部楼"></label>
              <label>类别<select id="filter-category"><option value="">全部</option><option value="question">问题</option><option value="suggestion">建议</option><option value="interaction">互动</option><option value="spam">垃圾</option><option value="general">一般</option></select></label>
              <label>草稿状态<select id="filter-status"><option value="">待操作</option><option value="all">全部（含历史）</option><option value="pending_review">待审核</option><option value="approved">已审核</option><option value="rejected">已拒绝</option><option value="copied">已复制</option><option value="published">已发布</option></select></label>
            </div><div class="actions"><button id="filter-comments" type="button">筛选</button><button id="analyze-comments" type="button">归类</button></div>
          </details>
          <table class="comment-source-table"><thead><tr><th><input id="select-comments" type="checkbox" aria-label="选择本页评论"></th><th>评论</th><th>类别</th><th>草稿</th></tr></thead><tbody id="comments"></tbody></table>
          <div class="actions queue-pagination"><button id="source-prev" type="button">上一页</button><span id="source-page" class="hint"></span><button id="source-next" type="button">下一页</button></div>
        </div>
        <div id="queue-batch-actions" class="actions queue-batch-actions" hidden>
          <button id="queue-batch-toggle" type="button">全选所有页</button>
          <span id="queue-batch-count" class="hint" aria-live="polite"></span>
          <button id="queue-batch-publish" class="primary" type="button">发布所选草稿</button>
        </div>
        <p id="queue-batch-progress" class="hint" role="status" hidden></p>
        <details id="queue-batch-result" class="subsection" hidden>
          <summary id="queue-batch-summary" aria-live="polite"></summary>
          <ul id="queue-batch-results" class="queue-batch-results"></ul>
        </details>
        <div id="queue-list"></div>
        <div class="actions queue-pagination"><button id="queue-prev" type="button" disabled>上一页</button><button id="queue-next" type="button" disabled>下一页</button><span id="queue-count-label" class="hint"></span></div>
      </article>
      <article class="win-group-box review-detail draft-panel" id="queue-detail" aria-label="记录详情"></article>
    </div>
  </section>

  <details id="comment-review" class="comment-context-details" data-workspace-anchor>
    <summary>所选评论上下文</summary>
    <span id="draft-status" class="badge"></span><p id="draft-source" class="quoted-text"></p><dl id="draft-meta" class="description-list"></dl>
    <button id="open-comment-memory" type="button" hidden>用户档案</button><a id="open-comment-draft" href="#comments" hidden>查看草稿</a><section id="comment-continuation" hidden></section>
    <p id="comment-context-state" class="hint"></p><p id="thread-context-state" class="hint"></p>
    <div class="actions"><button id="compact-comments" type="button">压缩当前楼</button><button id="rebuild-comments" type="button">重建上下文</button></div><p id="thread-rebuild-state" class="hint" role="status"></p>
  </details>
  <details class="comment-task-details"><summary>生成任务进度</summary><table><thead><tr><th>任务</th><th>状态</th><th>进度</th><th>原因</th></tr></thead><tbody id="comment-tasks"></tbody></table></details>
</section>
