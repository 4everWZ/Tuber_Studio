<section data-section="chat" class="operator-chat" hidden>
  <header class="operator-chat-heading">
    <div>
      <h1 id="operator-chat-title">与大肥鱼对话</h1>
      <p class="muted">私聊留存在工作台。动态草稿和只读浏览也可以从这里开始。</p>
    </div>
    <button id="operator-chat-clear" type="button">清空私聊</button>
  </header>
  <div id="operator-chat-feed" class="operator-chat-feed" role="log" aria-label="私聊消息" aria-live="polite"></div>
  <form id="operator-chat-form" class="operator-chat-compose">
    <div class="operator-chat-suggestions">
      <button type="button" data-chat-prompt="发个动态：">写动态</button>
      <button type="button" data-chat-prompt="去刷视频：">刷视频</button>
      <button type="button" data-chat-prompt="查看直播状态">直播状态</button>
    </div>
    <label for="operator-chat-input">给大肥鱼发消息</label>
    <textarea id="operator-chat-input" rows="2" maxlength="2000" required></textarea>
    <div class="operator-chat-actions">
      <span id="operator-chat-status" role="status"></span>
      <button class="primary" id="operator-chat-send" type="submit">发送</button>
    </div>
  </form>
</section>
