<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>你画我猜 · OBS Overlay</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
    }
    #draw-guess-container {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 440px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 16px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      color: #f8fafc;
      padding: 16px;
      transition: all 0.3s ease;
      opacity: 1;
    }
    #draw-guess-container[hidden] {
      display: none !important;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-row h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
    .badge {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .timer-badge {
      background: rgba(244, 63, 94, 0.2);
      color: #f43f5e;
      border: 1px solid rgba(244, 63, 94, 0.4);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      min-width: 42px;
      text-align: center;
    }
    .canvas-wrap {
      width: 100%;
      height: 280px;
      background: #090d16;
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg.drawing-board {
      width: 100%;
      height: 100%;
    }
    .hint-bar {
      margin-top: 10px;
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hint-bar .clue {
      color: #fde047;
      font-weight: 500;
    }
    .winner-banner {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      text-align: center;
      padding: 20px;
      animation: popIn 0.3s ease;
    }
    .winner-banner.hidden {
      display: none;
    }
    .winner-banner h4 {
      margin: 0 0 8px;
      font-size: 20px;
      color: #34d399;
    }
    .winner-banner p {
      margin: 4px 0;
      font-size: 14px;
      color: #f8fafc;
    }
    .winner-banner .answer-tag {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
      margin-top: 6px;
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="draw-guess-container" hidden>
    <div class="header">
      <div class="title-row">
        <span>🎨</span>
        <h3>大肥鱼 · 你画我猜</h3>
        <span id="category-badge" class="badge">分类: 待定</span>
      </div>
      <div id="timer-badge" class="timer-badge">60s</div>
    </div>
    <div class="canvas-wrap">
      <svg id="drawing-board" class="drawing-board" viewBox="0 0 400 300"></svg>
      <div id="winner-banner" class="winner-banner hidden">
        <h4 id="banner-title">🎉 抢答成功！</h4>
        <p id="banner-winner">恭喜 <strong>观众</strong> 猜对！</p>
        <div id="banner-answer" class="answer-tag">答案：【猫咪】</div>
      </div>
    </div>
    <div class="hint-bar">
      <span>发起：<span id="trigger-user">观众</span></span>
      <span id="clue-text" class="clue"></span>
    </div>
  </div>

  <script src="/static/draw-guess-overlay.js" defer></script>
</body>
</html>
