<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tuber Studio · Overlay</title><link rel="icon" href="data:,">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Segoe UI","Microsoft YaHei",sans-serif}body.scene{background:#e8f0fa}body.scene::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 78% 65%,#d4e4fa 0%,transparent 60%);pointer-events:none}.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;flex-direction:column;padding:3vh 5vw 5vh}.avatar-wrap{position:relative;display:flex;align-items:flex-end;justify-content:center;width:70vw;height:68vh;flex:1;min-height:0}.avatar{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 8px 12px #172c4a20)}.avatar[hidden]{display:none}.avatar-wrap.speaking{animation:speaking 1.1s ease-in-out infinite}.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;width:160px;height:160px;border:2px dashed #779abc;border-radius:50%;color:#405f7e;background:#edf4fccc;font-size:16px}.placeholder small{font-size:11px;margin-top:6px}.subtitle{max-width:950px;min-width:240px;background:#15263fe8;color:#fff;border:1px solid #b6d5ef80;border-radius:10px;padding:15px 24px;font-size:clamp(16px,2.5vw,29px);line-height:1.55;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 5px 20px #11233b22;margin-top:16px}.subtitle:empty{display:none}.ai-label{position:absolute;top:15px;left:18px;color:#365575;background:#edf5fedb;border:1px solid #b4cee6;padding:3px 8px;font-size:11px;border-radius:4px}.connection{position:absolute;right:18px;top:15px;font-size:11px;color:#405f7e;background:#edf5fedb;padding:4px 8px;border-radius:4px;max-width:60vw}.connection.error{color:#8e2d41;background:#fff0f2ed}.enable-audio{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);padding:15px 22px;border:1px solid #98b4d0;background:#fff;color:#254e79;border-radius:7px;font-size:15px;cursor:pointer;z-index:5}.enable-audio small{display:block;font-size:11px;color:#61788d;margin-top:5px}button:focus-visible{outline:3px solid #4796db;outline-offset:3px}[hidden]{display:none!important}@keyframes speaking{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){.avatar-wrap.speaking{animation:none}}
  </style>
</head>
<body>
  <span class="ai-label">虚构 AI 同人角色 · 非官方</span>
  <span id="connection" class="connection">正在连接播放器…</span>
  <main class="stage"><div id="avatar-wrap" class="avatar-wrap"><img id="avatar" class="avatar" alt="角色表情" hidden><div id="placeholder" class="placeholder">Tuber Studio<small>等待角色素材</small></div></div><div id="subtitle" class="subtitle" aria-live="polite"></div></main>
  <button id="enable-audio" class="enable-audio" hidden>启用浏览器音频<small>启用后接收下一次播报；失败任务不会重播</small></button>
  <script src="/static/overlay.js" defer></script>
</body>
</html>
