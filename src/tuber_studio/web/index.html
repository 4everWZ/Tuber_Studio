<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tuber Studio · 控制台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/app.css?v=20261112.01">
  <link rel="stylesheet" href="/static/account.css?v=20261113.01">
  <link rel="stylesheet" href="/static/continuation.css">
  <link rel="stylesheet" href="/static/memes.css?v=20261113.02">
  <link rel="stylesheet" href="/static/workbench.css?v=20261113.02">
  <link rel="stylesheet" href="/static/chat.css?v=20261113.06">
</head>
<body class="win-desktop">
  <main id="login" class="login-shell" hidden>
    <form id="login-form" class="login-panel">
      <div class="brand-mark" aria-hidden="true">TS</div>
      <h1>Tuber Studio</h1>
      <p class="muted">本地 AI 角色运营与直播工坊</p>
      <label>管理令牌<input id="token" type="password" autocomplete="current-password" placeholder="请输入启动令牌..." required></label>
      <p class="hint">本机访问可直接打开工作台。远程访问使用管理令牌，同一浏览器可保持登录。</p>
      <button class="primary" type="submit">登录工作台</button>
      <p id="login-error" role="alert" class="error-text"></p>
    </form>
  </main>

  <div id="workspace" class="workspace win-layout" hidden>
    <aside class="sidebar win-explorer-tree" id="workspace-sidebar">
      <div class="explorer-brand-box">
        <a class="brand" href="#chat">
          <span class="brand-mark" aria-hidden="true">TS</span>
          <div class="brand-info">
            <span class="brand-name">Tuber Studio</span>
            <span class="brand-version">大肥鱼工坊</span>
          </div>
        </a>
        <button type="button" id="close-workspace-menu" class="btn-close-pane" aria-label="关闭侧边栏">✕</button>
      </div>

      <nav class="explorer-nav" aria-label="工作区导航">
        <a href="#chat" data-page="chat" class="tree-node"><span class="node-text">对话</span></a>
        <a href="#automation" data-page="automation" data-parent-page="operations" class="tree-node"><span class="node-text">自主运营</span></a>

        <a href="#live" data-page="live" data-parent-page="live" class="tree-node"><span class="node-text">直播工作台</span></a>
        <a href="#characters" data-page="characters" data-parent-page="characters" class="tree-node"><span class="node-text">角色工作室</span></a>
        <a href="#settings" data-page="settings" data-parent-page="settings" class="tree-node"><span class="node-text">设置</span></a>
      </nav>

      <div class="explorer-tree-footer">
        <button id="logout-sidebar" type="button" class="btn-win-action" onclick="document.getElementById('logout')?.click()">
          退出登录
        </button>
      </div>
    </aside>

    <button type="button" id="workspace-backdrop" aria-label="关闭栏目" tabindex="-1"></button>

    <div class="main-shell win-main-shell">
      <header class="topbar win-command-bar" data-chat-hide>
        <div class="command-bar-left">
          <button type="button" id="workspace-menu" class="btn-command-toggle" aria-controls="workspace-sidebar" aria-expanded="false">
            <span aria-hidden="true">☰</span> 导航
          </button>
          

          <a href="#characters" id="workspace-character" class="win-badge-pill" title="查看当前角色设定" data-chat-hide>
            <span class="pill-text">角色待确认</span>
          </a>

          <a href="#settings" class="service-status-capsule win-badge-pill" id="service-status-capsule" title="查看推理端点与健康度" data-chat-hide>
            <span class="status-dot" aria-hidden="true"></span>
            <span class="status-text">推理状态待检查</span>
          </a>

          <div class="mode-workspace win-segmented-bar" data-chat-hide>
            <div class="mode-buttons" role="group" aria-label="推理模式" aria-describedby="resource-mode-feedback">
              <button type="button" data-inference-mode="text" aria-pressed="false" disabled class="btn-segment">
                运营模式
              </button>
              <button type="button" data-inference-mode="live" aria-pressed="false" disabled class="btn-segment">
                直播模式
              </button>
            </div>
            <span id="resource-mode-feedback" class="hint" role="status"></span>
          </div>
        </div>

        <div class="command-bar-right" data-chat-hide>
          <a href="#automation" id="discovery-top-state" class="win-quick-status" title="自主运营当前状态">
            <span class="status-indicator"></span> 自主运营 · 读取中
          </a>

          <a href="#issues" id="workspace-issues" class="win-quick-alert" title="查看告警日志">
            告警与错误
          </a>
        </div>
      </header>

      <div id="notice" class="notice win-notice" role="status" hidden></div>

      <main class="content win-content">
        <nav id="operations-navigation" data-workspace-navigation="operations" class="win-property-tabs" aria-label="自主运营" hidden>
          <a href="#automation" data-operations-tab="overview" class="prop-tab">活动</a>
          <a href="#comments" data-operations-tab="comments" class="prop-tab">评论处理</a>
          <a href="#messages" data-operations-tab="messages" class="prop-tab">私信</a>
          <a href="#dynamics" data-operations-tab="dynamics" class="prop-tab">动态</a>
          <a href="#automation-records" data-operations-tab="automation-records" class="prop-tab">运行记录</a>
          <a href="#automation-settings" data-operations-tab="automation-settings" class="prop-tab">运营设置</a>
        </nav>

        <nav data-workspace-navigation="live" class="win-property-tabs" aria-label="直播工作台" hidden>
          <a href="#live" data-workspace-tab="live" class="prop-tab">直播台</a>
          <a href="#live-scene" data-workspace-tab="live-scene" class="prop-tab">场景与编排</a>
          <a href="#live-music" data-workspace-tab="live-music" class="prop-tab">曲库与点歌</a>
          <a href="#live-settings" data-workspace-tab="live-settings" class="prop-tab">直播设置</a>
          <a href="#live-interaction" data-workspace-tab="live-interaction" class="prop-tab">互动玩法与游戏</a>
        </nav>
        <nav data-workspace-navigation="characters" class="win-property-tabs" aria-label="角色工作室" hidden>
          <a href="#characters" data-workspace-tab="characters" class="prop-tab">角色卡与记忆</a>
          <a href="#voices" data-workspace-tab="voices" class="prop-tab">语音与音色</a>
          <a href="#assets" data-workspace-tab="assets" class="prop-tab">素材与表情包</a>
        </nav>
        <nav data-workspace-navigation="settings" class="win-property-tabs" aria-label="设置" hidden>
          <a href="#settings" data-workspace-tab="settings" class="prop-tab">推理端点与模型</a>
          <a href="#accounts" data-workspace-tab="accounts" class="prop-tab">账号与登录</a>
          <a href="#overview" data-workspace-tab="overview" class="prop-tab">存储与维护</a>
          <a href="#issues" data-workspace-tab="issues" class="prop-tab">告警与错误</a>
        </nav>


        <!-- page: chat -->

        <!-- page: automation -->

        <!-- page: automation-records -->

        <!-- page: automation-settings -->

        <!-- page: issues -->

        <!-- page: comments -->

        <!-- page: messages -->

        <!-- page: dynamics -->

        <!-- page: live -->

        <!-- page: live-scene -->

        <!-- page: live-music -->

        <!-- page: live-settings -->

        <!-- page: live-interaction -->

        <!-- page: characters -->

        <!-- page: voices -->

        <!-- page: assets -->

        <!-- page: accounts -->

        <!-- page: settings -->

        <!-- page: overview -->
      </main>

      <footer class="win-statusbar" data-chat-hide>
        <div class="statusbar-panel panel-mode">
          <span class="sb-label">模式:</span>
          <span id="sb-status-mode" class="sb-val">运营模式</span>
        </div>
        <div class="statusbar-panel panel-character">
          <span class="sb-label">角色:</span>
          <span id="sb-status-char" class="sb-val">—</span>
        </div>
        <div class="statusbar-panel panel-engine" style="flex:1;">
          <span class="sb-label">推理端点:</span>
          <span id="sb-status-engine" class="sb-val">就绪</span>
        </div>
        <div class="statusbar-panel panel-time">
          <span id="sb-status-time" class="sb-val">00:00:00</span>
        </div>
      </footer>
    </div>
  </div>

  <script src="/static/modules/formatters.js?v=20261113.01" defer></script>
  <script src="/static/modules/pagination.js?v=20261105.30" defer></script>
  <script src="/static/modules/operations-workbench.js?v=20261113.01" defer></script>
  <script src="/static/cache-panel.js" defer></script>
  <script src="/static/inference-node.js?v=20261107.12" defer></script>
  <script src="/static/continuation.js?v=20261107.23" defer></script>
  <script src="/static/automation.js?v=20261113.01" defer></script>
  <script src="/static/account.js?v=20261113.01" defer></script>
  <script src="/static/daily-memory.js?v=20261113.03" defer></script>
  <script src="/static/interactive-games.js?v=20261107.12" defer></script>
  <script type="module" src="/static/app.js?v=20261113.11"></script>
</body>
</html>
